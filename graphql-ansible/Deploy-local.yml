# Use this if you have not pushed the project to GitHub yet.
# Copies ../graphql-task-api from this machine instead of cloning from Git.
- hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: Update APT package manager
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Copy project to /var/www/task-manager-api
      copy:
        src: ../graphql-task-api/
        dest: /var/www/task-manager-api/

    - name: Install project dependencies
      npm:
        path: /var/www/task-manager-api
        state: present

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Start the application with PM2
      command: pm2 start src/app.js --name task-manager
      args:
        chdir: /var/www/task-manager-api

    - name: Save PM2 process list
      command: pm2 save

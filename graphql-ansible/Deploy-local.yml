# Use this if you have not pushed the project to GitHub yet.
# Copies ../graphql-task-api from this machine instead of cloning from Git.
- hosts: localhost
  connection: local
  become: yes
  vars:
    app_dir: /var/www/task-manager-api

  tasks:
    - name: Update APT package manager
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Copy project to /var/www/task-manager-api
      copy:
        src: ../graphql-task-api/
        dest: "{{ app_dir }}/"

    - name: Install project dependencies
      npm:
        path: "{{ app_dir }}"
        state: present

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Start the application with PM2
      command: pm2 start src/app.js --name task-manager
      args:
        chdir: "{{ app_dir }}"
      register: pm2_start
      changed_when: "'already launched' not in pm2_start.stderr and 'already launched' not in pm2_start.stdout"
      failed_when: pm2_start.rc != 0 and 'already launched' not in pm2_start.stderr and 'already launched' not in pm2_start.stdout

    - name: Save PM2 process list
      command: pm2 save

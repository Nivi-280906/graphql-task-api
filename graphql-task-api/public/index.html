<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #7a7a7a; font-family: Arial, Helvetica, sans-serif;
    }
    .card { background: #fff; width: 340px; padding: 22px 20px; border-radius: 6px; }
    h1 {
      margin: 0 0 14px; text-align: center; font-size: 15px; letter-spacing: .5px;
      color: #5b2a9e; text-decoration: underline;
    }
    .add { display: flex; gap: 8px; margin-bottom: 14px; }
    .add input { flex: 1; padding: 6px 8px; font-size: 12px; border: 1px solid #333; border-radius: 2px; }
    button { border: 0; cursor: pointer; color: #fff; background: #3b7ddd; border-radius: 3px; }
    .add button { width: 28px; height: 28px; font-size: 18px; line-height: 1; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex; align-items: center; gap: 8px; background: #e6eaea;
      padding: 8px; margin-bottom: 8px; font-size: 13px;
    }
    li .name { flex: 1; }
    li.done .name { text-decoration: line-through; color: #777; }
    li button { width: 24px; height: 24px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>TASK MANAGEMENT SYSTEM</h1>
    <div class="add">
      <input id="newTask" type="text" placeholder="Add your task here..." />
      <button id="addBtn" title="Add">+</button>
    </div>
    <ul id="list"></ul>
  </div>

  <script>
    async function gql(query) {
      const res = await fetch('/graphql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      const json = await res.json();
      if (json.errors) throw new Error(json.errors[0].message);
      return json.data;
    }
    const esc = (s) => JSON.stringify(s);

    async function load() {
      const data = await gql('{ msglist { id jobtodo toggle } }');
      const list = document.getElementById('list');
      list.innerHTML = '';
      data.msglist.forEach((t) => {
        const li = document.createElement('li');
        if (t.toggle === 1) li.className = 'done';

        const tick = document.createElement('button');
        tick.textContent = '\u2713'; tick.title = 'Toggle done';
        tick.onclick = async () => {
          await gql(`mutation { updateTask(id: ${t.id}, toggle: ${t.toggle === 1 ? 0 : 1}) { id } }`);
          load();
        };

        const name = document.createElement('span');
        name.className = 'name'; name.textContent = t.jobtodo;

        const edit = document.createElement('button');
        edit.textContent = '\u270E'; edit.title = 'Edit';
        edit.onclick = async () => {
          const v = prompt('Edit task', t.jobtodo);
          if (v && v.trim()) {
            await gql(`mutation { updateTask(id: ${t.id}, jobtodo: ${esc(v.trim())}) { id } }`);
            load();
          }
        };

        const del = document.createElement('button');
        del.textContent = '\u2715'; del.title = 'Delete';
        del.onclick = async () => {
          await gql(`mutation { deleteTask(id: ${t.id}) { id } }`);
          load();
        };

        li.append(tick, name, edit, del);
        list.appendChild(li);
      });
    }

    async function addTask() {
      const input = document.getElementById('newTask');
      const v = input.value.trim();
      if (!v) return;
      await gql(`mutation { addTask(jobtodo: ${esc(v)}) { id } }`);
      input.value = '';
      load();
    }
    document.getElementById('addBtn').onclick = addTask;
    document.getElementById('newTask').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
    load();
  </script>
</body>
</html>
